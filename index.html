<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfc9bd">
<title>교행몬 전북 에디션</title>
<style>
:root { --body:#d8d2c6; --body2:#c4bdb0; --ink:#3a3631; --bezel:#4a4d57; --accent:#a54b5c; --scr-bg:#f4f1de; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:#2b2a29; }
body { display:flex; justify-content:center; align-items:flex-start; font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; touch-action:manipulation; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
#dev { width:100%; max-width:560px; min-height:100%; background:linear-gradient(180deg,var(--body),var(--body2)); padding:14px 14px 18px; display:flex; flex-direction:column; align-items:center; }
#bezel { background:var(--bezel); border-radius:12px 12px 36px 12px; padding:14px 14px 8px; display:flex; flex-direction:column; align-items:center; box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.25); }
#scr { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:var(--scr-bg); border-radius:2px; }
.brand { color:#b9bcc6; font-size:11px; letter-spacing:.12em; margin-top:7px; font-weight:600; }
.brand b { color:#e6a2ae; font-weight:700; }
#pad { width:100%; max-width:420px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto; align-items:center; margin-top:18px; touch-action:none; }
#dpad { position:relative; width:132px; height:132px; justify-self:start; margin-left:6px; touch-action:none; }
#dpad::before, #dpad::after { content:""; position:absolute; background:#2f3036; border-radius:6px; box-shadow:0 3px 0 #1d1d21; }
#dpad::before { left:44px; top:4px; width:44px; height:124px; }
#dpad::after { top:44px; left:4px; height:44px; width:124px; }
#dpad.on::before, #dpad.on::after { background:#26272c; }
#dpad i { position:absolute; z-index:2; width:0; height:0; border:7px solid transparent; pointer-events:none; }
#dpad .u { left:59px; top:14px; border-bottom-color:#55565f; border-top:0; }
#dpad .d { left:59px; bottom:14px; border-top-color:#55565f; border-bottom:0; }
#dpad .l { top:59px; left:14px; border-right-color:#55565f; border-left:0; }
#dpad .r { top:59px; right:14px; border-left-color:#55565f; border-right:0; }
#ab { justify-self:end; display:flex; gap:16px; transform:rotate(-22deg); margin-right:10px; margin-top:-6px; }
#ab button { width:60px; height:60px; border-radius:50%; border:0; background:var(--accent); color:#fbe6ea; font-weight:800; font-size:18px; box-shadow:0 4px 0 #6e2c39; touch-action:none; }
#ab button:nth-child(1) { margin-top:22px; }
#ab button.on { transform:translateY(3px); box-shadow:0 1px 0 #6e2c39; }
#ss { grid-column:1 / span 2; display:flex; justify-content:center; gap:26px; margin-top:20px; }
#ss button { width:66px; height:18px; border-radius:9px; border:0; background:#7d7a73; color:transparent; transform:rotate(-22deg); box-shadow:0 2px 0 #55524c; position:relative; touch-action:none; }
#ss button span { position:absolute; left:0; right:0; top:22px; color:#5a564f; font-size:10px; font-weight:700; letter-spacing:.08em; transform:rotate(22deg); }
#ss button.on { transform:rotate(-22deg) translateY(2px); box-shadow:none; }
.keys { display:none; }
body.pc #dev { max-width:820px; }
body.pc #pad { display:none; }
body.pc .keys { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 18px; margin:22px 0 0; color:#4a463f; font-size:13px; align-items:center; }
.keys span { white-space:nowrap; }
kbd { display:inline-block; min-width:22px; padding:2px 6px; margin-right:3px; border-radius:5px; background:#f3efe6; border:1px solid #9a9488; box-shadow:0 2px 0 #9a9488; font:600 12px/1.3 system-ui,sans-serif; color:#3a3631; text-align:center; }
#padToggle { border:0; background:none; color:#6b665d; text-decoration:underline; font-size:12px; cursor:pointer; padding:4px; }
</style>
</head>
<body>
<div id="dev">
  <div id="bezel">
    <canvas id="scr" width="160" height="144"></canvas>
    <div class="brand"><b>교행몬</b> · 전북 에디션</div>
  </div>
  <div id="pad">
    <div id="dpad" data-b="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <div id="ab"><button data-b="b">B</button><button data-b="a">A</button></div>
    <div id="ss"><button data-b="select"><span>SELECT</span></button><button data-b="start"><span>START</span></button></div>
  </div>
  <div class="keys" id="keys">
    <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 이동</span>
    <span><kbd>Z</kbd><kbd>Space</kbd> 확인</span>
    <span><kbd>X</kbd><kbd>Esc</kbd> 취소</span>
    <span><kbd>Enter</kbd> 메뉴</span>
    <button id="padToggle" type="button">화면 버튼 보이기</button>
  </div>
</div>

    else if (c > 1 && nav('right') && this.i % c < c - 1 && this.i + 1 < n) { this.i++; sfx('sel'); }

    else if (this.o.wrap && nav('down')) { this.i = 0; sfx('sel'); }

    else if (PRESS.b && this.o.cancel !== false) { sfx('sel'); this.resolve(-1); }

    this.items.forEach((s, k) => {

class ListMenu {
  constructor(o) {

// 수량 선택
class Qty {
  constructor(max, price) { this.n = 1; this.max = Math.max(1, max); this.price = price; }
  update() {
    if (nav('up')) { this.n = this.n >= this.max ? 1 : this.n + 1; sfx('sel'); }
    if (nav('down')) { this.n = this.n <= 1 ? this.max : this.n - 1; sfx('sel'); }
    if (nav('right')) { this.n = Math.min(this.max, this.n + 10); sfx('sel'); }
    if (nav('left')) { this.n = Math.max(1, this.n - 10); sfx('sel'); }
    if (PRESS.a) { sfx('sel'); this.resolve(this.n); } else if (PRESS.b) { sfx('sel'); this.resolve(0); }
  }
  draw() {
    const w = this.price ? 88 : 48;
    box(W - w, 64, w, 30);
    drawText('×' + String(this.n).padStart(2, '0'), W - w + 8, 74);
    if (this.price) drawTextR((this.n * this.price).toLocaleString() + '원', W - 8, 74);
  }
}
function qty(max, price) { return pushUI(new Qty(max, price)); }

async function fadeOut(col = 0, f = 4) { G.fadeCol = col; for (let i = 1; i <= 4; i++) { G.fade = i; await sleepF(f); } }
async function fadeIn(f = 4) { for (let i = 3; i >= 0; i--) { G.fade = i; await sleepF(f); } }
function drawFade() {
  if (!G.fade) return;
  ctx.globalAlpha = [0, 0.35, 0.65, 0.88, 1][G.fade];
  ctx.fillStyle = PAL[G.fadeCol]; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

// ───────── 주 반복 ─────────
let lastT = performance.now(), accT = 0;
function step() {
  G.frame++;
  for (const w of G.waits.slice()) if (--w.n <= 0) { G.waits.splice(G.waits.indexOf(w), 1); w.r(); }
  const top = G.ui[G.ui.length - 1];
  if (top) top.update(); else if (G.scene && G.scene.update) G.scene.update();
  if (G.scene && G.scene.tick) G.scene.tick();
  if (G.S) G.S.time += 1 / 60;
  PRESS = {};
}
function render() {
  ctx.save();
  if (G.shake) ctx.translate(G.shake, 0);
  if (G.scene && G.scene.draw) G.scene.draw(); else fillScr(0);
  ctx.restore();
  for (const w of G.ui) w.draw && w.draw();
  drawFade();
}
function loop(t) {
  const mult = window.__FAST || 1;
  accT += (t - lastT) * mult; lastT = t;
  if (accT > 200 * mult) accT = 200 * mult;
  let n = 0;
  while (accT >= 1000 / 60 && n < 8 * mult) { step(); accT -= 1000 / 60; n++; }
  render();
  requestAnimationFrame(loop);
}

  async doTurn(side, move) {

  calc(att, def, mv, side) {

  async playFx(side, type, miss) {

  drawFx() {

    const t = fx.t;
    const A = fx.side === 'p' ? [32, 72] : [132, 24], D = fx.side === 'p' ? [132, 24] : [32, 72];
    const lerp = (k) => [Math.round(A[0] + (D[0] - A[0]) * k), Math.round(A[1] + (D[1] - A[1]) * k)];
    const f = (c, x, y, w, h) => { ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, w, h); };
    const paper = (x, y, c = 0) => { f(3, x, y, 9, 11); f(c, x + 1, y + 1, 7, 9); f(2, x + 2, y + 3, 5, 1); f(2, x + 2, y + 5, 5, 1); f(2, x + 2, y + 7, 3, 1); };

    const miss = fx.miss;
    const tgt = miss ? [D[0] + 26, D[1] - 10] : D;
    switch (fx.kind) {
      case '일반': {
        const k = Math.min(1, t / 20), p = lerp(k);
        if (t < 22) { paper(p[0] - 4, p[1] - 12 - Math.round(Math.sin(k * Math.PI) * 10)); paper(p[0] - 1, p[1] - 9 - Math.round(Math.sin(k * Math.PI) * 10)); }
        else { for (let i = 0; i < 3; i++) paper(tgt[0] - 12 + i * 6, tgt[1] - 10 + (i % 2) * 3); }

      }

          const p = [Math.round(A[0] + (tgt[0] - 14 + i * 12 - A[0]) * k), Math.round(A[1] + (tgt[1] - 14 + (i % 2) * 10 - A[1]) * k - Math.sin(k * Math.PI) * 14)];
          f(3, p[0], p[1], 9, 9); f(1, p[0] + 1, p[1] + 1, 7, 7); f(2, p[0] + 2, p[1] + 3, 5, 1); f(2, p[0] + 2, p[1] + 5, 3, 1);

        if (t > 28 && !miss) stampBox(tgt[0], tgt[1] + 12, '합계');

        break;
      case '계약': {
        const y = t < 18 ? tgt[1] - 40 + t * 2 : tgt[1] - 4;

        break;
      }
      case '감사': {

        f(3, x - 5, y - 5, 11, 11); f(0, x - 4, y - 4, 9, 9); f(1, x - 3, y - 3, 3, 2); f(3, x + 5, y + 5, 2, 2); f(3, x + 7, y + 7, 2, 2);
        if (t > 30 && !miss) stampBox(tgt[0], tgt[1] + 14, '지적');
        break;
      }
    }
  }

        await say(m.st === 'burn' ? `${J(nm, '은는')} 번아웃으로 지쳐 간다!` : `${J(nm, '은는')} 민원 스트레스로 괴로워한다!`);
        const end = await this.checkFaint();
        if (end) return true;
      }
    }
    return false;
  }
  async throwBall(id) {
    if (!this.wild) {
      await say('트레이너의 교행몬은 영입할 수 없다!');
      return 'blocked';
    }
    useItem(id);
    await say(`${J(G.S.name, '은는')} ${J(id, '을를')} 던졌다!`, { auto: 30 });
    sfx('throw');
    await anim(24, i => { const t = i / 23; this.ball = [Math.round(40 + 82 * t), Math.round(60 - 70 * t + 50 * t * t)]; });
    this.ball = [122, 26];
    this.eHide = true;
    await sleepF(16);
    const E = this.E, sp = SP[E.sp];
    let a = ((3 * E.mhp - 2 * E.hp) * sp.rate * ITEMS[id].mult) / (3 * E.mhp);
    if (E.st === 'sleep' || E.st === 'freeze') a *= 2; else if (E.st) a *= 1.5;
    const p = Math.min(1, a / 255);
    const ok = Math.random() < p;
    const shakes = ok ? 3 : (p > 0.6 ? 2 : p > 0.3 ? rnd(1, 2) : rnd(0, 1));
    for (let s = 0; s < shakes; s++) {
      sfx('shake');
      await anim(16, i => { this.ball = [122 + (i < 8 ? (i % 4 < 2 ? -2 : 2) : 0), 26]; });
      await sleepF(10);
    }
    if (ok) {
      playMusic(null);
      const w = jingle('catch');
      await say(`좋았어! ${J(E.sp, '을를')} 영입했다!`);
      if (w) await sleepF(10);
      this.ball = null;
      const isNew = !G.S.caught[E.sp];
      G.S.caught[E.sp] = 1; G.S.seen[E.sp] = 1;
      if (isNew && G.S.flags.dex) { await say(`업무도감에 ${E.sp}의 정보가 새로 기록되었다!`); await showDexPage(E.sp); }
      E.st = E.st || null;
      if (G.S.party.length < 6) G.S.party.push(E);
      else { G.S.box.push(E); await say(`${J(E.sp, '은는')} 인력풀로 보내졌다.`); }
      this.result = 'caught';
      return 'caught';
    }
    this.ball = null; this.eHide = false;
    await say(['앗! 발령장을 뿌리쳤다!', '아까워! 거의 됐는데!', '아아! 조금만 더였는데!'][Math.min(2, shakes)]);
    return 'miss';
  }
}

async function levelUp(m, B) {
  const old = { mhp: m.mhp, atk: m.atk, def: m.def, spc: m.spc, spd: m.spd };

  calcStats(m);
  m.hp += m.mhp - old.mhp;

async function learnMove(m, mv) {
  const nm = monName(m);
  if (m.moves.length < 4) {
    m.moves.push({ id: mv, pp: MV[mv].pp });
    jingle('level');
    await say(`${J(nm, '은는')} ${J(mv, '을를')} 익혔다!`);
    return true;
  }
  for (;;) {
    await say(`${J(nm, '은는')} ${J(mv, '을를')} 익히고 싶어 한다!`);
    await say(`하지만 ${nm}에게는 이미 기술이 4개 있다.`);
    if (!(await yesno(`${J(mv, '을를')} 익히기 위해 다른 기술을 잊게 할까?`))) {
      if (await yesno(`${J(mv, '을를')} 익히는 것을 포기할까?`)) { await say(`${J(nm, '은는')} ${J(mv, '을를')} 익히지 않았다!`); return false; }
      continue;
    }
    await say('어떤 기술을 잊게 할까?', { auto: 1 });
    const k = await choose(m.moves.map(x => x.id), { x: 40, y: 34 });
    if (k < 0) continue;
    const old = m.moves[k].id;
    m.moves[k] = { id: mv, pp: MV[mv].pp };
    await say(`하나 둘… 짠! ${J(nm, '은는')} ${J(old, '을를')} 깨끗이 잊었다!`);
    jingle('level');
    await say(`그리고 ${J(nm, '은는')} ${J(mv, '을를')} 익혔다!`);
    return true;
  }
}

async function battle(opt) {

async function whiteout() {

function bagList(inBattle) {
  const ids = Object.keys(G.S.bag).filter(id => G.S.bag[id] > 0);
  const order = id => ({ ball: 0, heal: 1, cure: 2, repel: 3, tm: 4, key: 5 }[ITEMS[id].k]);
  ids.sort((a, b) => order(a) - order(b));
  return inBattle ? ids.filter(id => ['ball', 'heal', 'cure'].includes(ITEMS[id].k)) : ids;
}
async function bagMenu(inBattle, B) {
  let start = 0;
  for (;;) {
    const ids = bagList(inBattle);
    const items = () => [...bagList(inBattle).map(id => ({ label: id, right: ITEMS[id].k === 'key' ? '' : '×' + G.S.bag[id] })), { label: '닫기' }];
    const k = await listMenu({
      x: 24, y: 2, w: 136, h: 92, start, items,
      over: me => { box(0, 96, 160, 48); const id = bagList(inBattle)[me.i]; if (id) wrap(ITEMS[id].d, 142).slice(0, 2).forEach((l, i) => drawText(l, 9, 104 + i * 17)); },
    });
    if (k < 0 || k >= ids.length) return null;
    start = k;
    const id = ids[k], it = ITEMS[id];
    if (it.k === 'ball') {
      if (!inBattle) { await say('지금은 쓸 수 없다.'); continue; }
      return { t: 'ball', id };
    }
    if (it.k === 'heal' || it.k === 'cure') {
      const j = await partyPick(`${J(id, '을를')} 누구에게 쓸까요?`);
      if (j < 0) continue;
      const m = G.S.party[j];
      if (it.k === 'heal') {
        if (m.hp <= 0 || m.hp >= m.mhp) { await say('써도 효과가 없다.'); continue; }
        const before = m.hp; m.hp = Math.min(m.mhp, m.hp + it.hp); useItem(id); sfx('stat');
        await say(`${monName(m)}의 체력이 ${m.hp - before} 회복되었다!`);
      } else {
        if (m.st !== it.st) { await say('써도 효과가 없다.'); continue; }
        m.st = null; useItem(id); sfx('stat');
        await say(`${monName(m)}의 상태가 정상으로 돌아왔다!`);
      }
      if (inBattle) { if (B && m === B.M) B.dP = m.hp; return { t: 'item' }; }
      continue;
    }
    if (it.k === 'repel') {
      useItem(id); G.S.repel = 100; sfx('stat');
      await say(`${J(G.S.name, '은는')} ${J(id, '을를')} 붙였다! 한동안 조용할 것 같다.`);
      continue;
    }
    if (it.k === 'tm') {
      if (!(await yesno(`${id}에는 「${it.mv}」${J(it.mv, '이가').slice(it.mv.length)} 담겨 있다. 가르칠까?`))) continue;
      const j = await partyPick(`누구에게 가르칠까요?`);
      if (j < 0) continue;
      const m = G.S.party[j];
      if (m.moves.some(v => v.id === it.mv)) { await say(`${J(monName(m), '은는')} 이미 ${J(it.mv, '을를')} 알고 있다!`); continue; }
      if (await learnMove(m, it.mv)) useItem(id);
      continue;
    }
    await say(`${J(G.S.name, '은는')} ${J(id, '을를')} 꺼내 보았다. 지금은 쓸 때가 아니다.`);
  }
}

    const c = await ask(first ? '어서 오세요! 무엇을 도와 드릴까요?' : '더 필요한 건 없으세요?', ['사기', '팔기', '그만'], { x: 0, y: 0 });
    first = false;
    if (c === 0) {
      let start = 0;
      for (;;) {
        const k = await listMenu({
          x: 24, y: 24, w: 136, h: 72, start,
          items: () => [...stock.map(id => ({ label: id, right: ITEMS[id].price.toLocaleString() + '원' })), { label: '그만' }],
          over: me => { box(0, 96, 160, 48); const id = stock[me.i]; if (id) wrap(ITEMS[id].d, 142).slice(0, 2).forEach((l, i) => drawText(l, 9, 104 + i * 17)); drawMoney(); },
        });
        if (k < 0 || k >= stock.length) break;
        start = k;
        const id = stock[k], price = ITEMS[id].price;
        const max = Math.min(99, Math.floor(G.S.money / price));
        if (max < 1) { await say('돈이 모자라시네요.'); continue; }
        const n = await qty(max, price);
        if (!n) continue;
        if (!(await yesno(`${id} ${n}개, ${(n * price).toLocaleString()}원입니다. 괜찮으세요?`))) continue;
        G.S.money -= n * price; addItem(id, n); sfx('stat');
        await say('감사합니다!');
      }
    } else if (c === 1) {
      let start = 0;
      for (;;) {
        const ids = bagList(false).filter(id => ITEMS[id].price);
        const k = await listMenu({ x: 24, y: 24, w: 136, h: 72, start, items: () => [...ids.map(id => ({ label: id, right: '×' + G.S.bag[id] })), { label: '그만' }], over: () => drawMoney() });
        if (k < 0 || k >= ids.length) break;
        start = k;
        const id = ids[k], price = Math.floor(ITEMS[id].price / 2);
        const n = await qty(G.S.bag[id], price);
        if (!n) continue;
        if (!(await yesno(`${(n * price).toLocaleString()}원에 사 드릴게요. 괜찮으세요?`))) continue;
        G.S.bag[id] -= n; if (G.S.bag[id] <= 0) delete G.S.bag[id];
        G.S.money += n * price; sfx('stat');
      }
    } else { await say('또 오세요!'); return; }
  }
}

async function rivalBattle1() {
  const rv = OW.npc('rival'); const P = OW.P;
  await say(`${G.S.rival}: 잠깐, ${G.S.name}!`);
  if (rv) {
    // 플레이어 옆으로 다가오기
    rv.dir = 'down';
    while (rv && (Math.abs(rv.x - P.x) + Math.abs(rv.y - P.y)) > 1) {
      let d;
      if (rv.y < P.y - 1) d = 'down'; else if (rv.x < P.x) d = 'right'; else if (rv.x > P.x) d = 'left'; else d = 'down';
      const [dx, dy] = DIRV[d];
      if (!OW.passable(rv.x + dx, rv.y + dy, rv)) break;
      await walk(rv, d, 1);
    }
    const dx = P.x - rv.x, dy = P.y - rv.y;
    rv.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
    P.dir = OPP[rv.dir];
  }
  await say(`${G.S.rival}: 할아버지한테 받은 교행몬, 실력 좀 겨뤄 보자!`);
  const r = await battle({ trainer: rivalTrainer([[F().rivalSp, 5]], { defeat: `${G.S.rival}: 쳇! 내가 고른 게 더 센 줄 알았는데!` }), noWhiteout: true });
  if (r !== 'win') await say(`${G.S.rival}: 봤지? 역시 내가 고른 게 최고야!`);
  await says(`${G.S.rival}: 좋아, 밖에 나가서 더 키워 올 거야.`, `${G.S.rival}: 할아버지, 나 먼저 간다! ${G.S.name}, 다음에 또 붙자!`);
  F().rival1 = 1;
  if (rv) {
    const path = [];
    for (let i = 0; i < 12 && (rv.x !== 4 || rv.y !== 11); i++) {
      let d = null;
      if (rv.y < 8 && rv.x !== 4 && rv.x !== 5) d = rv.x < 4 ? 'right' : 'left';
      else if (rv.y < 11) d = 'down';
      else d = rv.x < 4 ? 'right' : 'left';
      const [dx, dy] = DIRV[d];
      if (!OW.passable(rv.x + dx, rv.y + dy, rv)) { if (d === 'down') { d = rv.x <= 4 ? 'right' : 'left'; const v = DIRV[d]; if (!OW.passable(rv.x + v[0], rv.y + v[1], rv)) break; } else break; }
      await walk(rv, d, 1);
    }
    sfx('door');
    rv.hide = true;
  }
  OW.refreshNpcs();
  healAll();
  await say('박사: 둘 다 수고했다. 교행몬들은 내가 쉬게 해 주마.');
}
async function profTalk() {
  if (F().gotStarter && G.S.bag['박사 택배'] && !F().dex) { await giveDex(); return; }
  if (!F().gotStarter) { await say('박사: 서류봉투 중에서 하나 골라 보거라.'); return; }
  if (!F().dex) { await says('박사: 1번 도로를 따라 북쪽으로 가면 전주가 나온단다.', '박사: 교행몬과 함께 걸어 보거라. 함께 다닐수록 서로 가까워지지.'); return; }
  const seen = Object.keys(G.S.seen).length, caught = Object.keys(G.S.caught).length;
  await say(`박사: 어디 업무도감 좀 보자. 발견 ${seen}종, 영입 ${caught}종이로구나.`);
  await say(caught < 5 ? '박사: 아직 시작일 뿐이다. 풀숲을 구석구석 다녀 보거라!' : '박사: 오오, 제법이구나! 이 기세로 계속해 보거라!');
}
async function giveDex() {
  await says(`박사: 오, ${G.S.name}! 그건… 내가 주문한 택배로구나!`, '박사: 일부러 들고 와 줬구나. 고맙다.');
  useItem('박사 택배');
  const P = OW.P;
  const rv = new Ent({ def: { id: 'tmp' }, x: 4, y: 11, dir: 'up', ch: 'rival' });
  OW.npcs.push(rv);
  sfx('door');
  for (let i = 0; i < 7; i++) {
    const nx = rv.x, ny = rv.y - 1;
    if (!OW.passable(nx, ny, rv) || (Math.abs(nx - P.x) + Math.abs(ny - P.y)) === 0) break;
    await walk(rv, 'up', 1);
    if (Math.abs(rv.x - P.x) + Math.abs(rv.y - P.y) <= 1) break;
  }
  await say(`${G.S.rival}: 할아버지! 무슨 일로 불렀어?`);
  await says('박사: 오, 마침 잘 왔다. 너희에게 부탁이 있단다.', '박사: 이게 바로 「업무도감」이다! 만난 교행몬이 저절로 기록되는 최신 기기지.', '박사: 하나씩 가져가거라.');
  F().dex = 1;
  playMusic(null);
  const w = jingle('item');
  await say(`${J(G.S.name, '은는')} 박사에게서 업무도감을 받았다!`);
  await sleepF(10); playMusic('town');
  await says('박사: 전북 곳곳의 교행몬을 모두 기록한 완전한 도감을 만드는 것. 그게 내 오랜 꿈이었단다.',
    '박사: 하지만 나는 이제 너무 늙었구나. 그 일을 너희가 대신 해 주겠니?',
    '박사: 이건 교행몬의 역사에 남을 위대한 일이란다!');
  await says(`${G.S.rival}: 걱정 마, 할아버지! 내가 다 해낼게!`, `${G.S.rival}: ${G.S.name}, 도감은 내가 먼저 채운다. 너한테는 안 져!`);
  rv.dir = 'down';
  for (let i = 0; i < 8 && rv.y < 11; i++) { if (!OW.passable(rv.x, rv.y + 1, rv)) break; await walk(rv, 'down', 1); }
  sfx('door'); OW.npcs.splice(OW.npcs.indexOf(rv), 1);
  await say('박사: 교행몬을 영입하려면 「발령장」이 있어야 한단다. 몇 장 주마.');
  await getItem('발령장', 5);
  await says('박사: 미발령 교행몬을 만나면 먼저 기술로 약하게 만든 다음 발령장을 던지는 게 요령이지.', '박사: 그럼 잘 다녀오거라!');
}

  signs: Object.fromEntries(['1,2', '8,2', '1,9', '8,9'].map(k => [k, () => say(`완주교육지원청 관장 한결\n도전에 성공한 트레이너: ${G.S.badges[0] ? G.S.name : '아직 없음'}`)])),
  npcs: [
    { id: 'leader', x: 4, y: 1, ch: 'leader', trainer: {
      id: 'g1', name: '관장 한결', ch: 'leader', team: [['포스티', 10], ['칸반이', 12]], money: 99, sight: 0,
      before: ['나는 완주교육지원청 관장 한결.', '모든 일은 계획에서 시작되지. 계획 없는 열정은 야근으로 끝나거든.', '네 계획을 보여 줘!'],
      defeat: '…좋은 계획이었어. 인정할게.',
      onWin: gymWin,
    }, talk: async () => { await says('배지는 너의 계획이 통했다는 증거야.', '다음 관문은 진안교육지원청이야. 계획대로만 가면 문제없을 거야.'); } },
    { x: 1, y: 5, ch: 'aide', dir: 'right', trainer: { id: 'g1t', name: '주무관 트레이너 지훈', ch: 'aide', team: [['포스티', 9], ['포스티', 9]], money: 20, sight: 4,
      before: '관장님께 가려면 나를 넘어야지! 계획은 세워 왔어?', defeat: '내 계획에 빈틈이 있었네…' }, talk: '기획형은 회계형에 약해. 관장님 칸반이도 마찬가지야.' },
    { x: 7, y: 10, ch: 'man2', dir: 'left', talk: async () => {
      if (G.S.badges[0]) { await say('오! 새싹 배지! 미래의 교행몬 마스터 납시었네!'); return; }
      await says('어이, 미래의 교행몬 마스터! 관장 한결은 기획형 교행몬을 쓴다네.', '기획형은 회계형과 민원형에 약하지. 회계형 교행몬이 있다면 든든할 거야!', '자, 힘내게!');
    } },
  ],
});
async function gymWin() {
  await say('나를 이긴 증표로 「새싹 배지」를 줄게.');
  G.S.badges[0] = 1;
  playMusic(null);
  const w = jingle('badge');
  await say(`${J(G.S.name, '은는')} 한결에게서 새싹 배지를 받았다!`);
  await sleepF(20);
  playMusic('gym');
  await say('그리고 이것도 가져가. 직무연수 이수증 01이야.');
  await getItem('이수증01', 1);
  await says('안에는 「개조식 정리」가 들어 있어. 긴 보고서를 한눈에 정리하는 기술이지.', '가방에서 꺼내 교행몬에게 가르쳐 봐.', '다음 관문은 진안교육지원청이야. 계획대로만 가면 문제없을 거야.');
  await sleepF(20);
  if (!F().demoEnd) {
    F().demoEnd = 1;
    await says('― 체험판은 여기까지입니다 ―', '진안, 무주, 장수… 남은 13개 관문과 야근단 이야기는 다음 판에서 이어집니다.', '저장해 두면 다음 판에서 이어서 할 수 있어요. 고맙습니다!');
  }
}

// ───────── 시작 ─────────
function fit() {
  const pad = document.getElementById('pad'), keys = document.getElementById('keys');
  const pc = document.body.classList.contains('pc');
  const vw = Math.min(window.innerWidth, pc ? 820 : 560) - 28;
  const vh = window.innerHeight - (pc ? 0 : pad.offsetHeight) - (pc ? keys.offsetHeight + 120 : 70);
  let s = Math.min(vw / 160, vh / 144);
  if (pc && s >= 2) s = Math.floor(s);
  s = Math.max(1, s);
  cv.style.width = Math.round(160 * s) + 'px';
  cv.style.height = Math.round(144 * s) + 'px';
}
addEventListener('resize', fit);
if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) setMode('pc', true);
document.getElementById('padToggle').addEventListener('click', e => { e.preventDefault(); setMode('touch', true); try { cv.focus(); } catch (_) {} });
loadOpt();
bindPad();
fit();
G.scene = TITLE;
playMusic('title');
requestAnimationFrame(loop);
window.__G = G;


</script>
