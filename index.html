<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfc9bd">
<title>교행몬 전북 에디션</title>
<style>
:root { --body:#d8d2c6; --body2:#c4bdb0; --ink:#3a3631; --bezel:#4a4d57; --accent:#a54b5c; --scr-bg:#f4f1de; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:#2b2a29; }
body { display:flex; justify-content:center; align-items:flex-start; font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; touch-action:manipulation; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
#dev { width:100%; max-width:560px; min-height:100%; background:linear-gradient(180deg,var(--body),var(--body2)); padding:14px 14px 18px; display:flex; flex-direction:column; align-items:center; }
#bezel { background:var(--bezel); border-radius:12px 12px 36px 12px; padding:14px 14px 8px; display:flex; flex-direction:column; align-items:center; box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.25); }
#scr { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:var(--scr-bg); border-radius:2px; }
.brand { color:#b9bcc6; font-size:11px; letter-spacing:.12em; margin-top:7px; font-weight:600; }
.brand b { color:#e6a2ae; font-weight:700; }
#pad { width:100%; max-width:420px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto; align-items:center; margin-top:18px; touch-action:none; }
#dpad { position:relative; width:132px; height:132px; justify-self:start; margin-left:6px; touch-action:none; }
#dpad::before, #dpad::after { content:""; position:absolute; background:#2f3036; border-radius:6px; box-shadow:0 3px 0 #1d1d21; }
#dpad::before { left:44px; top:4px; width:44px; height:124px; }
#dpad::after { top:44px; left:4px; height:44px; width:124px; }
#dpad.on::before, #dpad.on::after { background:#26272c; }
#dpad i { position:absolute; z-index:2; width:0; height:0; border:7px solid transparent; pointer-events:none; }
#dpad .u { left:59px; top:14px; border-bottom-color:#55565f; border-top:0; }
#dpad .d { left:59px; bottom:14px; border-top-color:#55565f; border-bottom:0; }
#dpad .l { top:59px; left:14px; border-right-color:#55565f; border-left:0; }
#dpad .r { top:59px; right:14px; border-left-color:#55565f; border-right:0; }
#ab { justify-self:end; display:flex; gap:16px; transform:rotate(-22deg); margin-right:10px; margin-top:-6px; }
#ab button { width:60px; height:60px; border-radius:50%; border:0; background:var(--accent); color:#fbe6ea; font-weight:800; font-size:18px; box-shadow:0 4px 0 #6e2c39; touch-action:none; }
#ab button:nth-child(1) { margin-top:22px; }
#ab button.on { transform:translateY(3px); box-shadow:0 1px 0 #6e2c39; }
#ss { grid-column:1 / span 2; display:flex; justify-content:center; gap:26px; margin-top:20px; }
#ss button { width:66px; height:18px; border-radius:9px; border:0; background:#7d7a73; color:transparent; transform:rotate(-22deg); box-shadow:0 2px 0 #55524c; position:relative; touch-action:none; }
#ss button span { position:absolute; left:0; right:0; top:22px; color:#5a564f; font-size:10px; font-weight:700; letter-spacing:.08em; transform:rotate(22deg); }
#ss button.on { transform:rotate(-22deg) translateY(2px); box-shadow:none; }
.keys { display:none; }
body.pc #dev { max-width:820px; }
body.pc #pad { display:none; }
body.pc .keys { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 18px; margin:22px 0 0; color:#4a463f; font-size:13px; align-items:center; }
.keys span { white-space:nowrap; }
kbd { display:inline-block; min-width:22px; padding:2px 6px; margin-right:3px; border-radius:5px; background:#f3efe6; border:1px solid #9a9488; box-shadow:0 2px 0 #9a9488; font:600 12px/1.3 system-ui,sans-serif; color:#3a3631; text-align:center; }
#padToggle { border:0; background:none; color:#6b665d; text-decoration:underline; font-size:12px; cursor:pointer; padding:4px; }
</style>
</head>
<body>
<div id="dev">
  <div id="bezel">
    <canvas id="scr" width="160" height="144"></canvas>
    <div class="brand"><b>교행몬</b> · 전북 에디션</div>
  </div>
  <div id="pad">
    <div id="dpad" data-b="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <div id="ab"><button data-b="b">B</button><button data-b="a">A</button></div>
    <div id="ss"><button data-b="select"><span>SELECT</span></button><button data-b="start"><span>START</span></button></div>
  </div>
  <div class="keys" id="keys">
    <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 이동</span>
    <span><kbd>Z</kbd><kbd>Space</kbd> 확인</span>
    <span><kbd>X</kbd><kbd>Esc</kbd> 취소</span>
    <span><kbd>Enter</kbd> 메뉴</span>
    <button id="padToggle" type="button">화면 버튼 보이기</button>
  </div>
</div>

// ───────── 전투 ─────────

class Battle {
  constructor(opt) {

  draw() {

  // ── 한 차례 ──  반환: true=전투 끝, null=이번 턴 남은 행동 생략, false=계속

  calc(att, def, mv, side) {

    S[st] = nv;

    this.pDy = 0; this.eDy = 0;

async function checkEvolutions() {
  for (const m of G.S.party) {

    let to = null;

function drumroll(n) { if (!AU.ctx || !AU.on) return; const t = AU.ctx.currentTime; for (let i = 0; i < n; i++) noise(t + i * 0.035, 0.03, 0.05 + i / n * 0.05); }
function claps() { if (!AU.ctx || !AU.on) return; const t = AU.ctx.currentTime; for (let i = 0; i < 18; i++) noise(t + i * 0.09 + Math.random() * 0.05, 0.04, 0.09); }
function ring() { if (!AU.ctx || !AU.on) return; const t = AU.ctx.currentTime; for (let i = 0; i < 8; i++) tone(i % 2 ? 1320 : 1660, t + i * 0.06, 0.05, 'square', 0.04); }
async function evolve(m, to, ng) {
  const prev = G.scene, old = m.sp;
  const S = new EvoScene(m, to || m.sp, ng);
  playMusic(null);
  await fadeOut(0, 3); G.scene = S; await fadeIn(3);
  // 1. 낌새
  for (let i = 0; i < 24; i++) { S.dx = i % 6 < 3 ? -1 : 1; await sleepF(2); }
  S.dx = 0;
  await say(`어? ${monName(m)}의 상태가…!`);
  // 2. 인사팀 전화
  S.bubble = [96, 4, '따르릉!']; ring(); await sleepF(30); ring();
  await say('인사팀에서 전화가 걸려 왔다!', { auto: 70 });
  S.bubble = null;
  // 3. 두근두근 (B를 누르고 있으면 미룸)
  let cancel = false;
  const fromArt = SP[old].art, toArt = SP[to || old].art;
  S.sil = !!to;
  for (let i = 0, gap = 26; i < 22; i++, gap = Math.max(3, Math.round(gap * 0.86))) {
    S.show = (to && i % 2) ? toArt : fromArt; if (!to) S.dx = i % 2 ? 1 : -1; sfx('tick'); drumroll(Math.round(gap / 2));
    S.sparkle(); S.sparkle();
    for (let k = 0; k < gap; k++) { S.dy = (k % 4 < 2) ? -1 : 0; await sleepF(1); if (BTN.b) cancel = true; }
    if (cancel) break;
  }
  S.dy = 0; S.dx = 0;
  if (cancel) {
    S.sil = false; S.show = fromArt;
    await say(`${monName(m)}: 아… 이번엔 사양할게요!`);
    await say(`${J(monName(m), '은는')} 승진을 미뤘다. 다음에 또 기회가 온다!`);
    await fadeOut(0, 3); G.scene = prev; return;
  }
  // 4. 발령장 등장
  sfx('throw');
  for (let y = -80; y <= 10; y += 6) { S.doc = [16, y]; await sleepF(1); }
  S.doc = [16, 10]; sfx('thud');
  await say('발령장이 날아왔다!', { auto: 80 });
  // 5. 짠!
  S.sil = false; S.show = toArt;
  for (let i = 0; i < 3; i++) { S.flash = 10; sfx('ding'); await sleepF(10); }
  for (let y = 10; y > -90; y -= 8) { S.doc = [16, y]; await sleepF(1); }
  S.doc = null; S.rays = true;
  S.burst(50); claps();
  const w = jingle('promo');
  for (let i = 0; i < 16; i++) { S.banner = -40 + Math.round(44 * Math.min(1, i / 12)); S.dy = -Math.round(Math.abs(Math.sin(i / 3)) * 6); await sleepF(2); }
  S.banner = 4; S.dy = 0;
  const oldMhp = m.mhp, oldLv = m.lv;
  // 승진: 직급 오르고 1호봉 내려감 (경력 진행분은 유지)
  const prog = m.exp - expAt(m.lv);
  m.grade = ng; m.lv = Math.max(1, m.lv - 1); m.exp = expAt(m.lv) + Math.max(0, Math.min(prog, expAt(m.lv + 1) - expAt(m.lv) - 1));
  if (to) { m.sp = to; G.S.seen[to] = 1; G.S.caught[to] = 1; }
  calcStats(m); m.hp = Math.max(1, Math.min(m.mhp, m.hp + m.mhp - oldMhp));
  await say(`축하합니다! ${J(old, '은는')} ${GRADES[ng]}${(jong(GRADES[ng]) === 0 || jong(GRADES[ng]) === 8) ? '로' : '으로'} 승진했다!`);
  if (to) await say(`모습도 바뀌어 ${J(to, '이가')} 되었다!`);
  await say(`승진하면서 호봉이 재조정되어 ${oldLv}호봉에서 ${m.lv}호봉이 되었다.`);
  S.burst(30); claps();
  await say(PROMO_LINES[rnd(0, PROMO_LINES.length - 1)]);
  if (w) await sleepF(5);
  await fadeOut(0, 4); G.scene = prev;
}

function bagList(inBattle) {

  return inBattle ? ids.filter(id => ['ball', 'heal', 'cure'].includes(ITEMS[id].k)) : ids;
}
async function bagMenu(inBattle, B) {

    const k = await listMenu({

      over: me => { box(0, 96, 160, 48); const id = bagList(inBattle)[me.i]; if (id) wrap(ITEMS[id].d, 142).slice(0, 2).forEach((l, i) => drawText(l, 9, 104 + i * 17)); },
    });

    start = k;
    const id = ids[k], it = ITEMS[id];
    if (it.k === 'ball') {

      if (j < 0) continue;
      const m = G.S.party[j];

        const before = m.hp; m.hp = Math.min(m.mhp, m.hp + it.hp); useItem(id); sfx('stat');
        await say(`${monName(m)}의 체력이 ${m.hp - before} 회복되었다!`);
      } else {
        if (m.st !== it.st) { await say('써도 효과가 없다.'); continue; }
        m.st = null; useItem(id); sfx('stat');
        await say(`${monName(m)}의 상태가 정상으로 돌아왔다!`);
      }
      if (inBattle) { if (B && m === B.M) B.dP = m.hp; return { t: 'item' }; }

    }

        if (max < 1) { await say('돈이 모자라시네요.'); continue; }

        await say('감사합니다!');

    } else if (c === 1) {
      let start = 0;
      for (;;) {
        const ids = bagList(false).filter(id => ITEMS[id].price);
        const k = await listMenu({ x: 24, y: 24, w: 136, h: 72, start, items: () => [...ids.map(id => ({ label: id, right: '×' + G.S.bag[id] })), { label: '그만' }], over: () => drawMoney() });

        start = k;
        const id = ids[k], price = Math.floor(ITEMS[id].price / 2);

        if (!n) continue;

        G.S.money += n * price; sfx('stat');
      }
    } else { await say('또 오세요!'); return; }
  }
}

const JB_OUTLINE = [[126.68, 36.02], [126.95, 36.1], [127.25, 36.13], [127.55, 36.14], [127.8, 36.04], [127.86, 35.86], [127.76, 35.63], [127.63, 35.4], [127.4, 35.3], [127.13, 35.29], [126.92, 35.36], [126.68, 35.33], [126.48, 35.42], [126.53, 35.58], [126.45, 35.68], [126.55, 35.76], [126.7, 35.82], [126.6, 35.93]];
const geo = (lon, lat) => [Math.round(10 + (lon - 126.45) / 1.4 * 140), Math.round(4 + (36.15 - lat) / 0.9 * 88)];
async function townMap() {
  const here = curMap().region || (curMap().exit && MAPS[curMap().exit.to].region) || null;
  let i = Math.max(0, REGIONS.findIndex(r => r[0] === here));
  const w = {
    update() {
      const r = REGIONS[i];
      let best = -1, bd = 1e9;
      for (const [k, d] of [['up', [0, -1]], ['down', [0, 1]], ['left', [-1, 0]], ['right', [1, 0]]]) {
        if (!nav(k)) continue;
        const [x0, y0] = geo(r[2], r[3]);
        REGIONS.forEach((q, j) => {
          if (j === i) return;
          const [x1, y1] = geo(q[2], q[3]), vx = x1 - x0, vy = y1 - y0;
          const along = vx * d[0] + vy * d[1]; if (along <= 0) return;
          const side = Math.abs(vx * d[1]) + Math.abs(vy * d[0]);
          const sc = along + side * 2; if (sc < bd) { bd = sc; best = j; }
        });
      }
      if (best >= 0) { i = best; sfx('sel'); }
      if (PRESS.a || PRESS.b) { sfx('sel'); this.resolve(); }
    },
    draw() {
      fillScr(0);
      // 바다 물결
      ctx.fillStyle = PAL[1];
      for (let y = 6; y < 92; y += 8) for (let x = 2 + (y % 16); x < 40; x += 16) { ctx.fillRect(x, y, 3, 1); ctx.fillRect(x + 3, y - 1, 2, 1); }
      // 땅
      const pts = JB_OUTLINE.map(([a, b]) => geo(a, b));
      ctx.fillStyle = PAL[1]; ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
      ctx.fillStyle = PAL[3];
      for (let k = 0; k < pts.length; k++) {
        const [x0, y0] = pts[k], [x1, y1] = pts[(k + 1) % pts.length], n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
        for (let t = 0; t <= n; t++) ctx.fillRect(Math.round(x0 + (x1 - x0) * t / n), Math.round(y0 + (y1 - y0) * t / n), 1, 1);
      }
      // 동쪽 산줄기
      ctx.fillStyle = PAL[2];
      for (const [lon, lat] of [[127.55, 36.07], [127.72, 35.95], [127.6, 35.82], [127.68, 35.7], [127.5, 35.5], [126.95, 35.5]]) { const [x, y] = geo(lon, lat); for (let q = 0; q < 4; q++) ctx.fillRect(x - q, y + q, 2 * q + 1, 1); }
      drawText('서해', 3, 84, 2);
      // 길
      ctx.fillStyle = PAL[2];
      for (let k = 0; k < ROUTE.length - 1; k++) {
        const a = REGIONS.find(r => r[0] === ROUTE[k]), b = REGIONS.find(r => r[0] === ROUTE[k + 1]);
        const [x0, y0] = geo(a[2], a[3]), [x1, y1] = geo(b[2], b[3]), n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
        for (let t = 0; t <= n; t += 3) ctx.fillRect(Math.round(x0 + (x1 - x0) * t / n), Math.round(y0 + (y1 - y0) * t / n), 1, 1);
      }
      // 시군 점
      REGIONS.forEach((r, j) => {
        const [x, y] = geo(r[2], r[3]), v = G.S.visited && G.S.visited[r[0]];
        ctx.fillStyle = PAL[3]; ctx.fillRect(x - 2, y - 2, 5, 5);
        ctx.fillStyle = PAL[v ? 3 : 0]; ctx.fillRect(x - 1, y - 1, 3, 3);
        if (r[0] === here && (G.frame >> 4) % 2) { ctx.fillStyle = PAL[0]; ctx.fillRect(x - 1, y - 1, 3, 3); }
      });
      const r = REGIONS[i], [cx, cy] = geo(r[2], r[3]);
      ctx.fillStyle = PAL[3]; ctx.fillRect(cx - 4, cy - 4, 9, 1); ctx.fillRect(cx - 4, cy + 4, 9, 1); ctx.fillRect(cx - 4, cy - 4, 1, 9); ctx.fillRect(cx + 4, cy - 4, 1, 9);
      box(0, 96, 160, 48);
      drawText(r[1] + (r[0] === here ? '  ◀ 지금 여기' : ''), 9, 102);
      wrap(r[4] + (G.S.visited && G.S.visited[r[0]] ? '' : (['wansan', 'jeonju', 'wanju'].includes(r[0]) ? '' : ' (준비 중)')), 142).slice(0, 2).forEach((l, k) => drawText(l, 9, 116 + k * 13, 2));
    },
  };
  await pushUI(w);
}

async function rivalBattle1() {
  const rv = OW.npc('rival'); const P = OW.P;
  await say(`${G.S.rival}: 잠깐, ${G.S.name}!`);
  if (rv) {
    // 플레이어 옆으로 다가오기
    rv.dir = 'down';
    while (rv && (Math.abs(rv.x - P.x) + Math.abs(rv.y - P.y)) > 1) {
      let d;
      if (rv.y < P.y - 1) d = 'down'; else if (rv.x < P.x) d = 'right'; else if (rv.x > P.x) d = 'left'; else d = 'down';
      const [dx, dy] = DIRV[d];
      if (!OW.passable(rv.x + dx, rv.y + dy, rv)) break;
      await walk(rv, d, 1);
    }
    const dx = P.x - rv.x, dy = P.y - rv.y;
    rv.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
    P.dir = OPP[rv.dir];
  }
  await say(`${G.S.rival}: 할아버지한테 받은 교행몬, 실력 좀 겨뤄 보자!`);
  const r = await battle({ trainer: rivalTrainer([[F().rivalSp, 2]], { defeat: `${G.S.rival}: 쳇! 내가 고른 게 더 센 줄 알았는데!` }), noWhiteout: true });
  if (r !== 'win') await say(`${G.S.rival}: 봤지? 역시 내가 고른 게 최고야!`);
  await says(`${G.S.rival}: 좋아, 밖에 나가서 더 키워 올 거야.`, `${G.S.rival}: 할아버지, 나 먼저 간다! ${G.S.name}, 다음에 또 붙자!`);
  F().rival1 = 1;
  if (rv) {
    const path = [];
    for (let i = 0; i < 12 && (rv.x !== 4 || rv.y !== 11); i++) {
      let d = null;
      if (rv.y < 8 && rv.x !== 4 && rv.x !== 5) d = rv.x < 4 ? 'right' : 'left';
      else if (rv.y < 11) d = 'down';
      else d = rv.x < 4 ? 'right' : 'left';
      const [dx, dy] = DIRV[d];
      if (!OW.passable(rv.x + dx, rv.y + dy, rv)) { if (d === 'down') { d = rv.x <= 4 ? 'right' : 'left'; const v = DIRV[d]; if (!OW.passable(rv.x + v[0], rv.y + v[1], rv)) break; } else break; }
      await walk(rv, d, 1);
    }
    sfx('door');
    rv.hide = true;
  }
  OW.refreshNpcs();
  healAll();
  await say('박사: 둘 다 수고했다. 교행몬들은 내가 쉬게 해 주마.');
}

async function giveDex() {
  await says(`박사: 오, ${G.S.name}! 그건… 내가 주문한 택배로구나!`, '박사: 일부러 들고 와 줬구나. 고맙다.');
  useItem('박사 택배');
  const P = OW.P;
  const rv = new Ent({ def: { id: 'tmp' }, x: 4, y: 11, dir: 'up', ch: 'rival' });
  OW.npcs.push(rv);
  sfx('door');
  for (let i = 0; i < 7; i++) {
    const nx = rv.x, ny = rv.y - 1;
    if (!OW.passable(nx, ny, rv) || (Math.abs(nx - P.x) + Math.abs(ny - P.y)) === 0) break;
    await walk(rv, 'up', 1);
    if (Math.abs(rv.x - P.x) + Math.abs(rv.y - P.y) <= 1) break;
  }
  await say(`${G.S.rival}: 할아버지! 무슨 일로 불렀어?`);
  await says('박사: 오, 마침 잘 왔다. 너희에게 부탁이 있단다.', '박사: 이게 바로 「업무도감」이다! 만난 교행몬이 저절로 기록되는 최신 기기지.', '박사: 하나씩 가져가거라.');
  F().dex = 1;
  playMusic(null);
  const w = jingle('item');
  await say(`${J(G.S.name, '은는')} 박사에게서 업무도감을 받았다!`);
  await sleepF(10); playMusic('town');
  await says('박사: 전북 곳곳의 교행몬을 모두 기록한 완전한 도감을 만드는 것. 그게 내 오랜 꿈이었단다.',
    '박사: 하지만 나는 이제 너무 늙었구나. 그 일을 너희가 대신 해 주겠니?',
    '박사: 이건 교행몬의 역사에 남을 위대한 일이란다!');
  await says(`${G.S.rival}: 걱정 마, 할아버지! 내가 다 해낼게!`, `${G.S.rival}: ${G.S.name}, 도감은 내가 먼저 채운다. 너한테는 안 져!`);
  rv.dir = 'down';
  for (let i = 0; i < 8 && rv.y < 11; i++) { if (!OW.passable(rv.x, rv.y + 1, rv)) break; await walk(rv, 'down', 1); }
  sfx('door'); OW.npcs.splice(OW.npcs.indexOf(rv), 1);
  await say('박사: 교행몬을 영입하려면 「발령장」이 있어야 한단다. 몇 장 주마.');
  await getItem('발령장', 5);
  await says('박사: 미발령 교행몬을 만나면 먼저 기술로 약하게 만든 다음 발령장을 던지는 게 요령이지.', '박사: 그럼 잘 다녀오거라!');
}

// ───────── 시작 ─────────
function fit() {
  const pad = document.getElementById('pad'), keys = document.getElementById('keys');
  const pc = document.body.classList.contains('pc');
  const vw = Math.min(window.innerWidth, pc ? 820 : 560) - 28;
  const vh = window.innerHeight - (pc ? 0 : pad.offsetHeight) - (pc ? keys.offsetHeight + 120 : 70);
  let s = Math.min(vw / 160, vh / 144);
  if (pc && s >= 2) s = Math.floor(s);
  s = Math.max(1, s);
  cv.style.width = Math.round(160 * s) + 'px';
  cv.style.height = Math.round(144 * s) + 'px';
}
addEventListener('resize', fit);
if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) setMode('pc', true);
document.getElementById('padToggle').addEventListener('click', e => { e.preventDefault(); setMode('touch', true); try { cv.focus(); } catch (_) {} });
loadOpt();
bindPad();
fit();
G.scene = TITLE;
playMusic('title');
requestAnimationFrame(loop);
window.__G = G;
