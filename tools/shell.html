<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfc9bd">
<title>교행몬 전북 에디션</title>
<style>
:root { --body:#d8d2c6; --body2:#c4bdb0; --ink:#3a3631; --bezel:#4a4d57; --accent:#a54b5c; --scr-bg:#f4f1de; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:#2b2a29; }
body { display:flex; justify-content:center; align-items:flex-start; font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; touch-action:manipulation; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
#dev { width:100%; max-width:560px; min-height:100%; background:linear-gradient(180deg,var(--body),var(--body2)); padding:14px 14px 18px; display:flex; flex-direction:column; align-items:center; }
#bezel { background:var(--bezel); border-radius:12px 12px 36px 12px; padding:14px 14px 8px; display:flex; flex-direction:column; align-items:center; box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.25); }
#scr { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:var(--scr-bg); border-radius:2px; }
.brand { color:#b9bcc6; font-size:11px; letter-spacing:.12em; margin-top:7px; font-weight:600; }
.brand b { color:#e6a2ae; font-weight:700; }
#pad { width:100%; max-width:420px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto; align-items:center; margin-top:18px; touch-action:none; }
#dpad { position:relative; width:132px; height:132px; justify-self:start; margin-left:6px; touch-action:none; }
#dpad::before, #dpad::after { content:""; position:absolute; background:#2f3036; border-radius:6px; box-shadow:0 3px 0 #1d1d21; }
#dpad::before { left:44px; top:4px; width:44px; height:124px; }
#dpad::after { top:44px; left:4px; height:44px; width:124px; }
#dpad.on::before, #dpad.on::after { background:#26272c; }
#dpad i { position:absolute; z-index:2; width:0; height:0; border:7px solid transparent; pointer-events:none; }
#dpad .u { left:59px; top:14px; border-bottom-color:#55565f; border-top:0; }
#dpad .d { left:59px; bottom:14px; border-top-color:#55565f; border-bottom:0; }
#dpad .l { top:59px; left:14px; border-right-color:#55565f; border-left:0; }
#dpad .r { top:59px; right:14px; border-left-color:#55565f; border-right:0; }
#ab { justify-self:end; display:flex; gap:16px; transform:rotate(-22deg); margin-right:10px; margin-top:-6px; }
#ab button { width:60px; height:60px; border-radius:50%; border:0; background:var(--accent); color:#fbe6ea; font-weight:800; font-size:18px; box-shadow:0 4px 0 #6e2c39; touch-action:none; }
#ab button:nth-child(1) { margin-top:22px; }
#ab button.on { transform:translateY(3px); box-shadow:0 1px 0 #6e2c39; }
#ss { grid-column:1 / span 2; display:flex; justify-content:center; gap:26px; margin-top:20px; }
#ss button { width:66px; height:18px; border-radius:9px; border:0; background:#7d7a73; color:transparent; transform:rotate(-22deg); box-shadow:0 2px 0 #55524c; position:relative; touch-action:none; }
#ss button span { position:absolute; left:0; right:0; top:22px; color:#5a564f; font-size:10px; font-weight:700; letter-spacing:.08em; transform:rotate(22deg); }
#ss button.on { transform:rotate(-22deg) translateY(2px); box-shadow:none; }
.keys { display:none; }
body.pc #dev { max-width:820px; }
body.pc #pad { display:none; }
body.pc .keys { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 18px; margin:22px 0 0; color:#4a463f; font-size:13px; align-items:center; }
.keys span { white-space:nowrap; }
kbd { display:inline-block; min-width:22px; padding:2px 6px; margin-right:3px; border-radius:5px; background:#f3efe6; border:1px solid #9a9488; box-shadow:0 2px 0 #9a9488; font:600 12px/1.3 system-ui,sans-serif; color:#3a3631; text-align:center; }
#padToggle { border:0; background:none; color:#6b665d; text-decoration:underline; font-size:12px; cursor:pointer; padding:4px; }
</style>
</head>
<body>
<div id="dev">
  <div id="bezel">
    <canvas id="scr" width="160" height="144"></canvas>
    <div class="brand"><b>교행몬</b> · 전북 에디션</div>
  </div>
  <div id="pad">
    <div id="dpad" data-b="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <div id="ab"><button data-b="b">B</button><button data-b="a">A</button></div>
    <div id="ss"><button data-b="select"><span>SELECT</span></button><button data-b="start"><span>START</span></button></div>
  </div>
  <div class="keys" id="keys">
    <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 이동</span>
    <span><kbd>Z</kbd><kbd>Space</kbd> 확인</span>
    <span><kbd>X</kbd><kbd>Esc</kbd> 취소</span>
    <span><kbd>Enter</kbd> 메뉴</span>
    <button id="padToggle" type="button">화면 버튼 보이기</button>
  </div>
</div>
<script>
/*__DATA__*/
/*__CODE__*/
</script>
</body>
</html>
